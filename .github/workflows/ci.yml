name: Beacon CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ── 1. Code Quality & Linting ──────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Server
        run: npm --prefix server run build

      - name: Typecheck Client
        run: npm --prefix client run build

  # ── 2. Backend Unit & Integration Tests ────────────────────────────────────
  server-tests:
    name: Backend Tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: beacon_test
          POSTGRES_USER: beacon_user
          POSTGRES_PASSWORD: beacon_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://beacon_user:beacon_secret@localhost:5432/beacon_test
        run: npm --prefix server run migrate

      - name: Run Server Test Suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://beacon_user:beacon_secret@localhost:5432/beacon_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci_test_access_secret_32_characters_min
          JWT_REFRESH_SECRET: ci_test_refresh_secret_32_characters_min
        run: npm --prefix server test

  # ── 3. Frontend Unit & Component Tests ─────────────────────────────────────
  client-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Client Vitest Suites
        run: npm --prefix client test

  # ── 4. Production Docker Build Validation ──────────────────────────────────
  docker-build:
    name: Docker Build Validation
    needs: [lint-and-typecheck, server-tests, client-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: beacon-server:ci

      - name: Build Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: beacon-client:ci
