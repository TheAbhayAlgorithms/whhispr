<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="co-grad-1" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#20B2AA" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="co-grad-2" x1="16" y1="48" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#20B2AA" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="18" fill="#141515" />
  <rect width="62" height="62" x="1" y="1" rx="17" stroke="#2C2E2E" stroke-width="1.5" />

  <!-- Outer 'C' Ribbon -->
  <path
    d="M42 18 C30 14, 16 22, 16 32 C16 42, 28 50, 42 46 C34 44, 25 39, 25 32 C25 25, 33 20, 42 18 Z"
    fill="url(#co-grad-1)"
    filter="url(#glow)"
  />

  <!-- Intersecting 'O' / Portal Ring -->
  <circle
    cx="38"
    cy="32"
    r="13"
    stroke="url(#co-grad-1)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Dynamic ComeOver bridge dot -->
  <circle cx="38" cy="32" r="4.5" fill="url(#co-grad-2)" />
</svg>
